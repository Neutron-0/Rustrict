[package]
name = "rustrict"
version = "2.0.0"
edition = "2021"
authors = ["Neutron-0"]
description = "High-performance Windows network bandwidth limiter, traffic shaper, and device manager"

[dependencies]
colored = "2.1"
comfy-table = "7.1"
rayon = "1.10"
parking_lot = "0.12"
socket2 = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.59", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_Foundation"
] }
